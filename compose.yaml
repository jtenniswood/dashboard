services:
  dashboard:
    build: .
    labels:
      dashboard.exclude: "true"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8180}:8080"
    volumes:
      - dashboard-data:/data
      - ./inventory:/snapshot:ro
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
volumes:
  dashboard-data:
